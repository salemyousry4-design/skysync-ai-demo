<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Dashboard — Sky Sync AI</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="brand/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/logo.svg">
<meta name="theme-color" content="#071226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sky Sync">
</head>
<body>
<script src="common.js"></script>
<script src="demo.js"></script>
<script>
const page = renderShell("commander", "Sky Sync AI", "Smart Maintenance Management — Command Dashboard");

function donut(counts, total) {
  const parts = [["AVAILABLE", "var(--green)"], ["AIRBORNE", "var(--cyan)"], ["UNDER_MAINTENANCE", "var(--orange)"],
                 ["AWAITING_SIGNOFF", "#eab308"], ["INSPECTION", "var(--purple)"], ["GROUNDED", "var(--red)"]];
  const C = 2 * Math.PI * 70; let offset = 0;
  const rings = parts.map(([k, color]) => {
    const n = counts[k] || 0; if (!n) return "";
    const len = C * n / total;
    const s = `<circle cx="90" cy="90" r="70" fill="none" stroke="${color}" stroke-width="26"
               stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)"/>`;
    offset += len; return s;
  }).join("");
  const ready = (counts.AVAILABLE || 0) + (counts.AIRBORNE || 0);
  const legend = parts.map(([k, color]) => `<div style="display:flex;align-items:center;gap:10px;margin:8px 0">
      <span class="edot" style="background:${color};margin:0"></span>${STATUS_LABEL[k]}<b style="margin-left:auto">${counts[k] || 0}</b></div>`).join("");
  return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
    <svg viewBox="0 0 180 180" width="180" height="180">${rings}
      <text x="90" y="88" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">${total ? Math.round(100 * ready / total) : 0}%</text>
      <text x="90" y="110" text-anchor="middle" fill="#c9d6ee" font-size="13">Mission Ready</text></svg>
    <div style="flex:1;min-width:180px">${legend}</div></div>`;
}

function trendChart(trend) {
  if (!trend.length) return '<p class="empty">No history yet.</p>';
  const W = 660, H = 220, L = 40, B = 24, T = 10, R = 30;
  const x = i => L + (W - L - R) * (trend.length === 1 ? 0.5 : i / (trend.length - 1));
  const y = v => T + (H - T - B) * (1 - v / 100);
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#1d3460"/>
      <text x="${L - 6}" y="${y(v) + 4}" fill="#8fa3c4" font-size="11" text-anchor="end">${v}%</text>`).join("");
  const pts = trend.map((p, i) => `${x(i)},${y(p.fleet_health)}`).join(" ");
  const labels = trend.map((p, i) => i % 7 === 0 || i === trend.length - 1
      ? `<text x="${x(i)}" y="${H - 4}" fill="#8fa3c4" font-size="11" text-anchor="middle">${fmtDate(p.day).replace(/, \d{4}/, "")}</text>` : "").join("");
  const dots = trend.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.fleet_health)}" r="3.5" fill="#3b82f6"><title>${p.day}: ${p.fleet_health}%</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${grid}
    <line x1="${L}" x2="${W}" y1="${y(90)}" y2="${y(90)}" stroke="#22c55e" stroke-dasharray="6 5"/>
    <polyline points="${pts}" fill="none" stroke="#3b82f6" stroke-width="2.5"/>${dots}${labels}</svg>
    <div class="muted" style="font-size:12px;text-align:center">● Fleet health &nbsp; <span style="color:var(--green)">- - Target ≥ 90%</span></div>`;
}

async function load() {
  let d;
  try { d = await api("/api/dashboard"); } catch (e) { toast(e.message, "err"); return; }
  const c = d.counts, maint = (c.UNDER_MAINTENANCE || 0) + (c.AWAITING_SIGNOFF || 0);
  const pct = n => d.total ? `(${Math.round(100 * n / d.total)}%)` : "";
  const ins = d.insight;
  const ready = (c.AVAILABLE || 0) + (c.AIRBORNE || 0);
  let actions = null;                                    // administrator only
  if (Session.user.role === "System Administrator") {
    try { actions = await api("/api/admin/activity?days=1"); } catch {}
  }
  page.innerHTML = `
  <div class="hero" id="hero">
    <div class="hero-text">
      <div class="hero-kicker">Helicopter Fleet · Readiness</div>
      <h2>${d.total ? Math.round(100 * ready / d.total) : 0}% Mission Ready</h2>
      <p>${ready} of ${d.total} aircraft ready · ${maint} in maintenance · ${c.INSPECTION || 0} in inspection${c.GROUNDED ? ` · ${c.GROUNDED} grounded (overdue)` : ""}</p>
    </div>
  </div>
  <div class="grid kpis">
    <div class="kpi k-blue"><div class="ico">${icon("fleet")}</div><div><div class="n">${d.total}</div><div class="l">Total Aircraft</div></div></div>
    <div class="kpi k-green"><div class="ico">${icon("check")}</div><div><div class="n">${c.AVAILABLE || 0}</div><div class="l">Available ${pct(c.AVAILABLE || 0)}</div></div></div>
    <div class="kpi k-orange"><div class="ico">${icon("wrench")}</div><div><div class="n">${maint}</div><div class="l">Under Maintenance ${pct(maint)}</div></div></div>
    <div class="kpi k-purple"><div class="ico">${icon("chart")}</div><div><div class="n">${c.INSPECTION || 0}</div><div class="l">Inspection ${pct(c.INSPECTION || 0)}</div></div></div>
    <div class="kpi k-cyan"><div class="ico">${icon("tower")}</div><div><div class="n">${c.AIRBORNE || 0}</div><div class="l">Airborne ${pct(c.AIRBORNE || 0)}</div></div></div>
    ${actions === null ? "" : `<a class="kpi k-purple" href="activity.html" title="Open the activity log">
      <div class="ico">${icon("bolt")}</div><div><div class="n">${actions.total_actions}</div>
      <div class="l">Total Actions · ${actions.today} today ▸</div></div></a>`}
  </div>
  <div class="grid row2">
    <div class="panel"><h2>${icon("chart")}Fleet Status Overview</h2>${donut(c, d.total)}</div>
    <div class="panel"><h2>${icon("chart")}Fleet Health Trend (Last 30 Days)</h2>${trendChart(d.trend)}</div>
  </div>
  <div class="grid row3">
    <div class="panel" style="overflow:auto"><h2>${icon("fleet")}Aircraft Fleet</h2>
      <table><tr><th>Aircraft ID</th><th>Status</th><th>Last Maintenance</th><th>Next Due</th><th>Health</th><th></th></tr>
      ${d.aircraft.map(a => `<tr><td><b>${esc(a.aircraft_id)}</b></td><td>${badge(a.ops_status)}</td>
        <td>${fmtDate(a.last_maintenance_at)}</td><td class="${a.overdue ? "overdue" : ""}">${fmtDate(a.next_due_at)}</td>
        <td class="${healthClass(a.health.score)}">${a.health.score}%</td>
        <td><button class="btn sm gray" onclick="showAircraft('${esc(a.aircraft_id)}')">View</button></td></tr>`).join("")}
      </table></div>
    <div class="panel"><h2>${icon("wrench")}Recent Maintenance Events</h2>
      <ul class="events">${d.events.map(e => `<li>${eventDot(e.kind)}<div>${esc(e.message)}</div><span class="t">${fmtDateTime(e.created_at)}</span></li>`).join("")}</ul></div>
  </div>
  <div class="grid row4">
    <div class="panel"><h2>${icon("bulb")}Predictive Maintenance Insight</h2>
      <div class="insight">
        <div class="big" style="background:${ins.ok ? "#14532d" : "#7c2d12"};color:${ins.ok ? "var(--green)" : "var(--orange)"}">${icon(ins.ok ? "check" : "bolt")}</div>
        <div style="flex:1;min-width:200px"><h3 style="color:${ins.ok ? "var(--green)" : "var(--orange)"}">${esc(ins.headline)}</h3>
          ${ins.alerts.length ? ins.alerts.map(a => `<div class="muted">• ${esc(a.text)}</div>`).join("") : '<div class="muted">No immediate maintenance alerts.</div>'}</div>
        <div class="facts"><div>Next check (earliest): <b>${fmtDate(ins.next_check)}</b></div>
          <div>Estimated availability (7 days): <b>${ins.availability_7d}%</b></div>
          <div>Fleet risk level: <b>${ins.risk_level}</b></div></div>
      </div></div>
    <div class="panel"><h2>${icon("bolt")}Quick Actions</h2>
      <div class="actions">
        <a class="btn" href="engineer.html">${icon("wrench")}Workshop</a>
        <a class="btn green" href="chief.html">${icon("check")}Sign-offs</a>
        <a class="btn purple" href="assistant.html">${icon("ai")}AI Assistant</a>
        <a class="btn gray" href="tower.html">${icon("tower")}Tower</a>
      </div></div>
  </div>`;
}
async function stationInfo() {
  try {
    const info = await api("/api/system/info");
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.style.cursor = "pointer";
    chip.title = "Show QR code for phones";
    chip.innerHTML = `<div>Phones & iPads ▸ QR<b>${esc(info.lan_url)}</b></div>`;
    chip.onclick = () => showPhoneQr(info.lan_url);
    document.querySelector(".topbar .right").prepend(chip);
  } catch {}
}
if (page) { load(); connectLive(load); stationInfo(); }
</script>
</body>
</html>
